<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:hx="https://htmx.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="UTF-8">
        <title>DiscordTable</title>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js" integrity="sha384-ZBXiYtYQ6hJ2Y0ZNoYuI+Nq5MqWBr+chMrS/RkXpNzQCApHEhOt2aY8EJgqwHLkJ" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>

        <img th:src="@{/images/background.png}"
             src="index.html"
             alt="Background design"
             class="bg-image"
             style="
               position: fixed;      /* stays in one place */
               top: 0;
               left: 0;
               width: 25vw;         /* full width */
               height: auto;           /* maintain aspect ratio */
               transform: translate(0, 0); /* center by moving half its width/height */
               object-fit: cover;     /* cover entire viewport */
               z-index: -1;           /* behind other content */
             ">

        <div class="d-flex flex-column container justify-content-center align-items-center w-50 mx-auto min-vh-100">

            <h1>Hello, World!</h1>

            <p>
                Welcome, <span th:text="${userName ?: 'Guest'}"></span>!
            </p>

            <div th:text="${message}">default message</div>

            <div class="bg-primary border border-secondary my-3" style="width:100px; height:100px;"></div>

            <a th:href="@{/create}" class="btn btn-primary my-3">Create User</a>

            <div th:replace="~{fragments :: userTable}"></div>

        </div>
        
        <script>
            console.log([...document.getElementsByName("idNumber")].map(item => item.textContent));
        </script>
        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
