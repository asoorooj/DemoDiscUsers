<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
<h2>Edit User</h2>

<form th:action="@{/edit(id=${id})}" th:object="${userDTO}" method="post" class="border-4 border-dark">

  <label>id:</label>
  <div th:text="${id}"></div>

  <label>First Name:</label>
  <input type="text" th:field="*{firstName}" /><br/>

  <label>Username:</label>
  <input type="text" th:field="*{userName}" /><br/>

  <label>Primary Role:</label>
  <input type="text" th:field="*{primaryRole}" /><br/>

  <label>Is Admin:</label>
  <input type="checkbox" th:field="*{isAdmin}" /><br/>

  <label>Birthdate:</label>
  <input type="date" th:field="*{birthdate}" /><br/>

  <button type="submit">Save User</button>
</form>

<div th:if="${status}">
  <p th:text="${status}"></p>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>
